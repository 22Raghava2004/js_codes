<script>
    const url_request='https://pokeapi.co/api/v2/pokemon/'+prompt("enter a pokemon name")
    const hrx = new XMLHttpRequest()
   
    hrx.open('GET', url_request)
     hrx.onreadystatechange =function(){
        //console.log(hrx.readyState)
        if(hrx.readyState==4 ){
            const data= JSON.parse(this.responseText)
            //console.log(typeof data)
            console.log(data)
            let coun=0
            for (const key in data){
                if (coun<5){
                console.log(key,data[key])
                coun++
                }
                else{
                    break
                }
            }
            
        }
    }
    
    hrx.send()



</script>
