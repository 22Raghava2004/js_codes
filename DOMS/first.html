<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Blog</title>

<style>
body{
    background-color:black;
    font-family:Arial, sans-serif;
}

/* Heading */

#head1{
    color:blue;
}

#head1:hover{
    background:brown;
    transition:0.6s;
}

/* H2 */

.h2class{
    display:flex;
    justify-content:center;
    margin:30px;
}

#header2{
    display:inline-block;
    color:white;
    background:red;
    padding:80px;
    font-size:22px;
    font-weight:bold;
    border-radius:15px;
}

#header2:hover{
    animation:colors 1s infinite;
}

@keyframes colors{
    0%{background:red;}
    25%{background:blue;}
    50%{background:green;}
    75%{background:orange;}
    100%{background:pink;}
}

/* Paragraph Section */

.divdiv{
    display:flex;
    justify-content:center;
}

.paradiv{
    width:60%;
}

.lol{
    background:aqua;
    color:black;
    font-size:30px;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}

/* Inputs */

.goodboy{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:40px;
    margin-top:40px;
}

.search-tab,
.textbox{
    padding:10px;
    font-size:18px;
    border-radius:8px;
    border:none;
}

/* List */

.list{
    color:white;
    font-size:22px;
}

.list li{
    margin:10px;
}

/* Textarea */

.area{
    display:block;
    width:300px;
    height:150px;
    margin:40px auto;
    padding:10px;
    font-size:18px;
}

/* Button */

button{
    display:block;
    margin:20px auto;
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:green;
    color:white;
    transition:.3s;
}
</style>

</head>

<body>

<h1 id="head1">
    Hi I am Raghava
</h1>

<h1 id="head1">
    fokof
</h1>

<div class="h2class">
    <h2 id="header2">
        This is my blog post of my work<span id="span1" style="display:none;">gwag gwag</span>
    </h2>
    
</div>


<div class="divdiv">
    <div class="paradiv">
        <p class="lol">Hi this is me and myself</p>
        <p class="lol">The second box</p>
        <p class="lol">The third box</p>
    </div>
</div>

<div class="goodboy">

    <input
        type="search"
        placeholder="Search here"
        class="search-tab">

    <input
        type="text"
        placeholder="Type here"
        class="textbox">

    <ol class="list">
        <li class="eldor">First</li>
        <li class="eldor">Second</li>
        <li class="eldor">Third</li>
        <li class="eldor">Fourth</li>
    </ol>

</div>

<textarea
class="area"
placeholder="Place here"></textarea>

<button id="btn">Uthole</button>



</body>
</html>
