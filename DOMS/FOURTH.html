<script>
    //this is one type
   

    // this is one of more of type of assigning 

    function addlanguage2(language){
        
        const li=document.createElement('li')
        li.innerHTML=`${language}`
        document.querySelector('.language').appendChild(li)
        

    }
    addlanguage2('java')
    addlanguage2('python')

    function optilang(lang){
        li=document.createElement('li')
        li.appendChild(document.createTextNode(`${lang}`))
        document.querySelector('.language').appendChild(li)


    }
    optilang('C++')

    // Edit

    const second=document.querySelector("li:nth-child(2)")
    //second.innerHTML='pokemon'
    const listt=document.createElement('li')
    listt.appendChild(document.createTextNode('pokemon'))
    second.replaceWith(listt)
